name: Build SortFlow macOS
on:
  push:
    branches: ['codex/sortflow-2.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sortflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test, build universal app and package DMG
        run: bash scripts/build-macos.sh
      - name: Upload runnable application
        uses: actions/upload-artifact@v4
        with:
          name: SortFlow-2.0-macOS
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload diagnostics and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SortFlow-build-diagnostics
          path: |
            build/*.log
            build/screenshot.png
          retention-days: 30
